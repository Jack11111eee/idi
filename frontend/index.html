<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>交互式讨论迭代系统</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- 左:文档区(阶段 1-2 = 草稿视图;阶段 3+ = 轮次占位) -->
    <main id="doc-pane">
      <h1>文档区</h1>

      <!-- 进入表单(FLOW-01:目录路径输入 + 进入按钮) -->
      <div id="enter-form">
        <input type="text" id="enter-path-input" placeholder="输入项目目录绝对路径(如 /Users/you/my-project)">
        <button id="btn-enter">进入</button>
        <p class="hint">讨论文档由 AI 直接读写该目录下的 docs/ 子目录。</p>
      </div>

      <!-- 状态徽标(页面右上角,当前推导状态中文名) -->
      <div id="state-badge" class="hidden"></div>

      <!-- 子视图:draft-view(阶段 1-2:草稿 markdown 渲染 + 认可雏形按钮位) -->
      <div id="draft-view" class="doc-subview hidden">
        <h2>雏形草稿(draft.md)</h2>
        <div id="draft-content" class="markdown-body"><!-- markdown 渲染区 --></div>
        <div class="draft-empty hidden" id="draft-empty">
          <p class="hint">尚无草稿——和 AI 讨论出实质进展后,它会写入 docs/draft.md。</p>
        </div>
        <button id="btn-approve-draft" disabled title="Plan 04 实现">认可雏形(下阶段开放)</button>
      </div>

      <!-- 子视图:rounds-placeholder(阶段 3+:最小轮次占位) -->
      <div id="rounds-placeholder" class="doc-subview hidden">
        <h2>轮次视图</h2>
        <p class="hint" id="rounds-hint">已进入轮次阶段(本阶段占位)。</p>
      </div>
    </main>

    <!-- 右:侧栏(会话流 + AI 工作面板,§4.1) -->
    <aside id="sidebar">
      <!-- 会话流(阶段 1-2:消息列表 + 输入框) -->
      <section id="session-panel">
        <header class="panel-header">
          <h2>会话流</h2>
        </header>
        <div class="panel-body">
          <div id="chat-messages"><!-- 消息气泡动态追加 --></div>
          <div id="chat-input-row">
            <input type="text" id="message-input" placeholder="输入消息,回车或点发送">
            <button id="btn-send">发送</button>
          </div>
        </div>
      </section>

      <section id="ai-panel">
        <header id="ai-panel-header" class="panel-header">
          <h2>AI 工作面板</h2>
          <div class="panel-header-right">
            <span id="abort-inline-hint"></span>
            <span class="collapse-indicator">▾</span>
          </div>
        </header>
        <div id="ai-panel-body" class="panel-body">
          <!-- 探针控制:路线选择 + 项目目录输入 + 发起 + 中止(Task 3 双轨可切换) -->
          <div id="probe-controls">
            <select id="ai-route-select" title="AICaller 实现路线">
              <option value="sdk">Claude Agent SDK</option>
              <option value="subprocess">子进程兜底</option>
            </select>
            <input type="text" id="project-path-input" placeholder="输入临时项目目录绝对路径">
            <button id="btn-ping">发起测试调用</button>
            <button id="btn-abort" class="danger">中止</button>
          </div>
          <div id="ai-events" class="event-list"><!-- 事件条目动态追加 --></div>
        </div>
      </section>
    </aside>
  </div>

  <!-- 权限确认弹窗(AI-04:confirm 处置征求用户) -->
  <div id="permission-modal" class="overlay hidden">
    <div class="overlay-card">
      <h3>权限确认</h3>
      <p id="permission-message"></p>
      <div class="modal-buttons">
        <button id="btn-permission-allow" class="primary">同意</button>
        <button id="btn-permission-deny" class="danger">拒绝</button>
      </div>
    </div>
  </div>

  <!-- vendored 单文件 markdown 渲染库(无 CDN 网络依赖) -->
  <script src="vendor/marked.min.js"></script>
  <script src="app.js"></script>

  <!-- claude CLI 自检浮层(§7.1:只挡第一次;通过或重检通过即隐藏) -->
  <div id="cli-check-overlay" class="overlay hidden">
    <div class="overlay-card">
      <h3>启动前自检</h3>
      <p id="cli-check-message"></p>
      <button id="cli-recheck-btn">我已装好,重新检测</button>
    </div>
  </div>
</body>
</html>
